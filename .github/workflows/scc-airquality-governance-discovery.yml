name: SCC Air Quality governance source discovery

on:
  workflow_dispatch:
  schedule:
    # Small monthly metadata scan, not scientific publication.
    - cron: '23 4 5 * *'

permissions:
  contents: read

concurrency:
  group: scc-airquality-governance-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing UKEI CLI
        run: python -m pip install .
      - name: Discover bounded air-quality governance sources
        shell: bash
        env:
          UKEI_HTTP_TIMEOUT_SECONDS: '12'
        run: |
          set -euo pipefail
          mkdir -p airquality-governance/discovery
          : > airquality-governance/failed_queries.txt
          db="$RUNNER_TEMP/scc-airquality-governance.sqlite3"
          ukei --database "$db" init
          i=0
          for query in \
            'industrial emissions' 'waste incineration' 'pollution inventory' \
            'air quality monitoring' 'air pollution monitoring' 'environmental permitting' \
            'continuous emissions monitoring' 'air quality calibration' \
            'compliance assessment' 'industrial installations'; do
            name=$(printf '%02d' "$i")
            i=$((i+1))
            if ! ukei --database "$db" discover \
              --provider all --query "$query" --limit 40 \
              --output "airquality-governance/discovery/$name.json" \
              --import-candidates; then
              printf '%s\n' "$query" >> airquality-governance/failed_queries.txt
            fi
          done
      - name: Build testable provenance receipts and candidate-only register
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/scc_airquality_official_references.json \
            airquality-governance/official_reference_leads.json
          python -m ukei.air_quality_governance \
            airquality-governance/discovery airquality-governance
      - name: Retain source discovery receipts including partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scc-airquality-governance-source-discovery
          path: airquality-governance/
          retention-days: 90
          if-no-files-found: error
      - name: Fail closed on provider errors, missing queries or empty discovery
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .status == "CANDIDATE_DISCOVERY_ONLY" and
            .query_receipts_valid == 10 and
            .unique_candidate_sources > 0
          ' airquality-governance/scc_airquality_governance_manifest.json > /dev/null
