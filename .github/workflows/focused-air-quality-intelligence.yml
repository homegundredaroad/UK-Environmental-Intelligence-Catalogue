name: Focused AirQuality Intelligence

on:
  workflow_dispatch:
    inputs:
      validate_sample:
        description: Validate a bounded sample of discovered landing pages
        required: false
        default: true
        type: boolean
      validation_limit:
        description: Maximum discovered sources to live-check (25-150)
        required: false
        default: 75
        type: number

permissions:
  contents: read

concurrency:
  group: focused-air-quality-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-scan:
    name: Focused cross-media discovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UKEI_HTTP_TIMEOUT_SECONDS: "8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Discover AirQuality and cross-media candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focused-output/discovery
          DB="${RUNNER_TEMP}/focused.sqlite3"
          ukei --database "${DB}" seed

          queries=(
            "air quality"
            "air pollution"
            "particulate matter"
            "nitrogen dioxide"
            "particle number"
            "ultrafine particles"
            "black carbon"
            "ammonia"
            "acid aerosol"
            "volatile organic compounds"
            "polycyclic aromatic hydrocarbons"
            "heavy metals"
            "mercury"
            "atmospheric deposition"
            "PFAS"
            "microplastics"
          )

          for query in "${queries[@]}"; do
            slug=$(printf '%s' "${query}" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-')
            ukei --database "${DB}" discover \
              --provider all \
              --query "${query}" \
              --limit 150 \
              --output "focused-output/discovery/${slug}.json" \
              --import-candidates
          done

          ukei --database "${DB}" export focused-output/focused-catalogue.json
          ukei --database "${DB}" status > focused-output/catalogue-status.txt

          python - <<'PY'
          from ukei.cross_media import build_cross_media_report
          report = build_cross_media_report(
              "focused-output/focused-catalogue.json", "focused-output/cross-media"
          )
          print(report)
          PY

      - name: Validate bounded landing-page sample
        if: ${{ inputs.validate_sample }}
        shell: bash
        run: |
          set -euo pipefail
          limit=${{ inputs.validation_limit }}
          if [ "${limit}" -lt 25 ] || [ "${limit}" -gt 150 ]; then
            echo "validation_limit must be between 25 and 150" >&2
            exit 2
          fi
          ukei --database "${RUNNER_TEMP}/focused.sqlite3" validate \
            --live \
            --limit "${limit}" \
            --report-only \
            --output focused-output/focused-validation-report.json

      - name: Build concise run receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          catalogue = Path("focused-output/focused-catalogue.json")
          payload = json.loads(catalogue.read_text(encoding="utf-8"))
          summary = json.loads(
              Path("focused-output/cross-media/cross-media-summary.json").read_text(encoding="utf-8")
          )
          receipt = {
              "receipt_version": 1,
              "purpose": "Focused AirQuality/cross-media discovery and triage; not comprehensive validation",
              "catalogue_record_count": len(payload.get("records", [])),
              "catalogue_sha256": hashlib.sha256(catalogue.read_bytes()).hexdigest(),
              "cross_media_unique_source_count": summary["unique_source_count"],
              "cross_media_candidate_match_count": summary["candidate_match_count"],
              "counts_by_stressor": summary["counts_by_stressor"],
              "scientific_admissibility_conferred": False,
              "review_status": "REVIEW_REQUIRED",
          }
          Path("focused-output/run-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Retain focused evidence
        uses: actions/upload-artifact@v7
        with:
          name: ukei-focused-air-quality-intelligence
          path: focused-output/
          if-no-files-found: error
          retention-days: 30
